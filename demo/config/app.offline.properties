# "Gemma off" copy of app.properties for the live demo: a second shop on port 8687 whose Gemma address leads nowhere,
# so every AI feature shows its fallback (keyword rules, local colour reading, rule-based assistant; NFR02).
# It has its own database, so the main demo data on port 8686 stays untouched.
# Start it with:  ./run.sh config/app.offline.properties      and open http://127.0.0.1:8687
server.port=8687
db.path=data/ecom_offline.db

gemma.baseUrl=http://127.0.0.1:9/llm/v1/
gemma.model=gemma-4
gemma.timeoutSeconds=15

whisper.baseUrl=http://127.0.0.1:9000
whisper.model=small
whisper.timeoutSeconds=15

ranking.alpha=0.45
ranking.beta=0.45
ranking.gamma=0.10
