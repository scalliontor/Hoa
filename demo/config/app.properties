# Họa. demo configuration (read by EcomApplication).
server.port=8686
db.path=data/ecom.db

# The Gemma base URL must end with "/".
# Gemma 4 through DeepInfra's OpenAI-compatible API; the key is in app.local.properties (not in git).
# Until 11/11/2026 the same interface reached the self-hosted vLLM server http://171.226.10.121:8000/llm/v1/ (model gemma-4).
gemma.baseUrl=https://api.deepinfra.com/v1/openai/
# The key is not in git: put "gemma.apiKey=<key>" in config/app.local.properties (see HUONG_DAN_GOI_GEMMA4.md).
gemma.apiKey=
gemma.model=google/gemma-4-31B-it-turbo
gemma.timeoutSeconds=15

# Self-hosted Whisper speech-to-text server (demo/voice-server).
whisper.baseUrl=http://127.0.0.1:9000
whisper.model=small
whisper.timeoutSeconds=15

# Ranking weights of slide A06: S = alpha*Stext + beta*Simage + gamma*Sbusiness.
ranking.alpha=0.45
ranking.beta=0.45
ranking.gamma=0.10
